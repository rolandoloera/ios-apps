name: Actualizar apps.json

# Al subir o borrar un .ipa (o cambiar meta.json / icons), se regenera apps.json y se guarda en el repo.
on:
  push:
    branches: [main]
    paths: ["ipas/**", "icons/**", "meta.json", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # para la fecha de cada .ipa (último commit)

      - name: Generar apps.json
        run: python3 scripts/build_source.py

      - name: Guardar apps.json
        run: |
          if [ -z "$(git status --porcelain apps.json)" ]; then
            echo "apps.json sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "Actualizar apps.json"
          git pull --rebase
          git push
